name: APEX FH5 CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install @capacitor/app@^8.0.0 --no-save
      - run: npm run lint
      - run: npm run build
